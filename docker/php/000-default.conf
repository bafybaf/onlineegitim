<VirtualHost *:80>
  ServerName onlineilahiyat.com
  ServerAlias www.onlineilahiyat.com
  DocumentRoot /var/www/html
  <Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
  SetEnvIf X-Forwarded-Proto "https" HTTPS=on
  RemoteIPHeader X-Forwarded-For
  RemoteIPInternalProxy 10.0.0.0/8
  RemoteIPInternalProxy 172.16.0.0/12
  RemoteIPInternalProxy 192.168.0.0/16
  ProxyRequests Off
  ProxyPreserveHost Off
  ProxyTimeout 60
  SetEnvIf Request_URI "^/mtx-hls/" no-gzip
  SetEnvIf Request_URI "^/mtx-whep/" no-gzip
  ProxyPass /mtx-hls/ http://mediamtx:8888/ nocanon flushpackets=on timeout=60
  ProxyPassReverse /mtx-hls/ http://mediamtx:8888/
  ProxyPass /mtx-whep/ http://mediamtx:8889/ nocanon flushpackets=on timeout=60
  ProxyPassReverse /mtx-whep/ http://mediamtx:8889/
  <LocationMatch "^/mtx-whep/">
    RequestHeader unset X-CSRF-TOKEN
  </LocationMatch>
  <LocationMatch "^/mtx-(hls|whep)/">
    Header always set Cache-Control "no-cache, no-store, must-revalidate, max-age=0"
    Header always set Pragma "no-cache"
    Header always set CDN-Cache-Control "no-store"
  </LocationMatch>
  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
